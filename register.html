<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkUp Register</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
font-family:'Inter',sans-serif;
}
</style>

</head>

<body class="bg-gradient-to-br from-indigo-600 via-purple-600 to-blue-600 min-h-screen flex items-center justify-center p-6">

<div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">

<div class="text-center mb-8">

<h1 class="text-4xl font-bold text-indigo-600">
LinkUp
</h1>

<p class="text-gray-500 mt-2">
Create your account 🚀
</p>

</div>

<div class="space-y-4">

<input
type="text"
id="username"
placeholder="Username"
class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
/>

<input
type="email"
id="email"
placeholder="Email Address"
class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
/>

<input
type="password"
id="password"
placeholder="Password"
class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
/>

<button
id="registerBtn"
class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition"
>
Create Account
</button>

</div>

<div class="text-center mt-6">

<p class="text-gray-500">
Already have an account?
</p>

<a
href="login.html"
class="text-indigo-600 font-semibold hover:underline"
>
Login
</a>

</div>

</div>

<script type="module" src="./js/auth.js"></script>

</body>
</html>
