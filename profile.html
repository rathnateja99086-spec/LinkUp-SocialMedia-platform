<nav class="flex flex-col gap-xs flex-1">

</a>
<a class="flex items-center gap-md px-md py-sm hover:bg-surface-container-low rounded-xl transition-all cursor-pointer text-on-surface-variant" href="#">
<span class="material-symbols-outlined">search</span>

</a>
<a class="flex items-center gap-md px-md py-sm rounded-xl transition-all cursor-pointer text-primary font-bold" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-headline-sm text-headline-sm">Profile</span>
</a>
</nav>
<a

<!-- Main Content Area -->

<!-- Header Sticky Navigation -->
<div class="sticky top-0 z-30 glass-effect flex items-center px-md h-16 gap-lg border-b border-outline-variant/30">
<button onclick="window.location.href='feed.html'">

</button>
<div class="flex flex-col">
<h1 id="profileNameTop"
    class="font-headline-sm text-headline-sm leading-tight">
    Loading...
</h1>

<span id="postCountTop"
      class="text-label-sm text-on-surface-variant">
    0 Posts
</span>
</div>
</div>
<!-- Profile Header -->

<!-- Cover Image -->

<span class="material-symbols-outlined text-[18px]">link</span>

</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>

</button>

id="userPosts"
class="divide-y divide-outline-variant/30">

<span class="material-symbols-outlined">home</span>
</button>

<span class="material-symbols-outlined">search</span>
</button>

<span class="material-symbols-outlined">mail</span>
</button>
<button class="p-md text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
</button>
</nav>
<script>
        // Micro-interactions
        document.querySelectorAll('article').forEach(post => {
            post.addEventListener('mouseenter', () => {
                post.style.transform = 'translateY(-2px)';
                post.style.transition = 'transform 0.2s ease-out';
            });
            post.addEventListener('mouseleave', () => {
                post.style.transform = 'translateY(0)';
            });
        });

        // Tab switching logic (Visual only)
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('tab-active', 'text-primary', 'font-bold');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('tab-active');
                tab.classList.remove('text-on-surface-variant');
            });
        });
    </script>



<script type="module" src="js/profile.js"></script>
